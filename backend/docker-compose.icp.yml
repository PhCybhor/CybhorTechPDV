# CybhorPDV API — deploy na VPS iContainer
# A partir de backend/: docker compose -f docker-compose.icp.yml up -d --build
# O contexto do build e a pasta sistemaPDV (landing + API).

networks:
  icontainer-network:
    external: true

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: cybhorpdv-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3333"
    ports:
      - "127.0.0.1:3333:3333"
    networks:
      - icontainer-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3333/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
