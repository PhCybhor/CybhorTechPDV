name: Deploy VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/app/**"
      - "backend/db/**"
      - "backend/public/**"
      - "backend/scripts/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - "landing/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

# Deploys em fila (nunca dois ao mesmo tempo, nunca cancela um em andamento).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  URL_PRODUCAO: https://pdv.vps10229.panel.icontainer.run

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Testes do backend
        working-directory: backend
        run: |
          # Cada arquivo roda em processo proprio: os testes trocam modulos em sys.modules.
          for arquivo in tests/test_*.py; do
            echo "::group::$arquivo"
            python "$arquivo"
            echo "::endgroup::"
          done

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empacotar API e landing
        run: |
          mkdir pacote
          cp -r backend/app backend/db backend/public backend/scripts landing pacote/
          cp backend/requirements.txt pacote/
          printf '%s\n' "$GITHUB_SHA" > pacote/REVISION
          find pacote -type d -name '__pycache__' -prune -exec rm -rf {} +
          tar -czf cybhorpdv.tgz -C pacote .
          ls -lh cybhorpdv.tgz

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar e aplicar na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # A chave so executa o script de deploy no servidor; o pacote vai pelo stdin.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            "$VPS_USER@$VPS_HOST" < cybhorpdv.tgz

      - name: Conferir producao
        run: |
          for tentativa in $(seq 1 10); do
            if curl -fsS --max-time 10 "$URL_PRODUCAO/api/saude" | grep -q '"ok":true'; then
              echo "Producao respondendo."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Producao nao respondeu apos o deploy."
          exit 1

      - name: Remover chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
