name: Release CybhorPDV

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do release (ex: 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Criar arquivo .env
        shell: pwsh
        run: |
          @"
          CYBHOR_API_URL=${{ secrets.CYBHOR_API_URL }}
          CYBHOR_MODO_DEV=0
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Gerar instalador Windows
        run: npm run dist

      - name: Definir versao do release
        id: versao
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: CybhorPDV ${{ steps.versao.outputs.version }}
          generate_release_notes: true
          files: |
            dist/CybhorPDV-Setup-${{ steps.versao.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
