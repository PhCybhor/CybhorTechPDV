name: Release CybhorPDV

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do release (vazio = package.json). Ex: 2.1.7"
        required: false
        default: ""

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Garantir .env de producao no instalador
        shell: pwsh
        env:
          CYBHOR_API_URL_SECRET: ${{ secrets.CYBHOR_API_URL }}
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $apiUrl = "$env:CYBHOR_API_URL_SECRET"
          if ([string]::IsNullOrWhiteSpace($apiUrl)) {
            $apiUrl = "https://pdv.vps10229.panel.icontainer.run"
          }
          $gemini = "$env:GEMINI_API_KEY_SECRET"
          $linhas = @(
            "CYBHOR_API_URL=$apiUrl",
            "CYBHOR_MODO_DEV=0"
          )
          if (-not [string]::IsNullOrWhiteSpace($gemini)) {
            $linhas += "GEMINI_API_KEY=$gemini"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "build/env.producao"),
            (($linhas -join "`n") + "`n"),
            (New-Object System.Text.UTF8Encoding $false)
          )
          Copy-Item "build/env.producao" ".env" -Force
          # Nao imprime a chave da IA nos logs.
          Get-Content "build/env.producao" | ForEach-Object {
            if ($_ -match '^GEMINI_API_KEY=') { 'GEMINI_API_KEY=***' } else { $_ }
          }

      - name: Instalador Windows 10 / 11
        run: npm run dist:win10

      - name: Limpar pasta do Win10 antes do Win7
        shell: pwsh
        run: |
          # Evita reaproveitar win-unpacked com Electron 31 no build Win7.
          if (Test-Path dist) {
            Get-ChildItem dist -Directory | Remove-Item -Recurse -Force
          }
          if (Test-Path dist-win7) {
            Remove-Item dist-win7 -Recurse -Force
          }

      - name: Instalador Windows 7
        run: npm run dist:win7

      - name: Definir versao do release
        id: versao
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $pkgVersion) { throw "package.json sem version" }
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = ("${{ github.ref_name }}" -replace '^v', '')
            if ($version -ne $pkgVersion) {
              throw "Tag v$version difere de package.json ($pkgVersion). Atualize um dos dois."
            }
          } else {
            $inputVersion = "${{ inputs.version }}".Trim()
            $version = if ($inputVersion) { $inputVersion } else { $pkgVersion }
            if ($version -ne $pkgVersion) {
              throw "inputs.version ($version) difere de package.json ($pkgVersion). Ajuste o input ou o package.json."
            }
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: CybhorPDV ${{ steps.versao.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/CybhorPDV-Setup-win10-x64.exe
            dist/CybhorPDV-Setup-win7-x64.exe
            dist/CybhorPDV-Setup-win7-ia32.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
