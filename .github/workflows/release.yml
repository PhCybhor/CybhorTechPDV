name: Release CybhorPDV

# Toda alteracao do app desktop na main gera uma versao nova e publica no GitHub Releases.
# Instaladores: CybhorPDV-Setup-x64.exe e CybhorPDV-Setup-ia32.exe.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "electron/**"
      - "renderer/**"
      - "build/**"
      - "vendor/**"
      - "scripts/build-renderer.mjs"
      - "scripts/dist-windows.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do release (vazio = automatica). Ex: 2.2.0"
        required: false
        default: ""

# Releases em fila: o proximo so calcula a versao depois que o anterior criou a tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  versao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calcular.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular versao
        id: calcular
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          tags=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          ultima=$(sort -V <<< "$tags" | tail -n 1)

          # package.json acima da ultima tag = salto manual (minor/major); senao, proximo patch.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$pkg" ]]; then
              echo "::error::Tag v$version difere de package.json ($pkg)."
              exit 1
            fi
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ -z "$ultima" || ( "$pkg" != "$ultima" && "$(printf '%s\n' "$ultima" "$pkg" | sort -V | tail -n 1)" == "$pkg" ) ]]; then
            version="$pkg"
          else
            IFS=. read -r maior menor patch <<< "$ultima"
            version="$maior.$menor.$((patch + 1))"
          fi

          if [[ ! "$version" =~ ^[0-9]{1,3}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
            echo "::error::Versao invalida: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" ]] && grep -qx "$version" <<< "$tags"; then
            echo "::error::A versao $version ja foi lancada."
            exit 1
          fi
          echo "Versao do release: $version (package.json $pkg, ultima tag ${ultima:-nenhuma})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: versao
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      VERSAO: ${{ needs.versao.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar versao no app
        run: npm version "$env:VERSAO" --no-git-tag-version --allow-same-version

      - name: Garantir .env de producao no instalador
        shell: pwsh
        env:
          CYBHOR_API_URL_SECRET: ${{ secrets.CYBHOR_API_URL }}
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $apiUrl = "$env:CYBHOR_API_URL_SECRET"
          if ([string]::IsNullOrWhiteSpace($apiUrl) -or $apiUrl -match 'vps|icontainer|panel\.icontainer') {
            $apiUrl = "https://pdv.cybhor.tech"
          }
          $gemini = "$env:GEMINI_API_KEY_SECRET"
          $linhas = @(
            "CYBHOR_API_URL=$apiUrl",
            "CYBHOR_MODO_DEV=0"
          )
          if (-not [string]::IsNullOrWhiteSpace($gemini)) {
            $linhas += "GEMINI_API_KEY=$gemini"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "build/env.producao"),
            (($linhas -join "`n") + "`n"),
            (New-Object System.Text.UTF8Encoding $false)
          )
          Copy-Item "build/env.producao" ".env" -Force
          # Nao imprime a chave da IA nos logs.
          Get-Content "build/env.producao" | ForEach-Object {
            if ($_ -match '^GEMINI_API_KEY=') { 'GEMINI_API_KEY=***' } else { $_ }
          }

      - name: Instaladores Windows 7, 8, 10 e 11 (64 e 32 bits)
        run: npm run dist

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: CybhorPDV ${{ env.VERSAO }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/CybhorPDV-Setup-x64.exe
            dist/CybhorPDV-Setup-ia32.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Apps já instalados ainda consultam a VPS (URL antiga no .exe).
  # Publicar lá faz o aviso de atualização aparecer sem desinstalar.
  publicar-vps:
    needs: [versao, build-windows]
    uses: ./.github/workflows/publicar-instaladores.yml
    with:
      versao: ${{ needs.versao.outputs.version }}
    secrets: inherit
